name: Refresh reviewed data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-reviewed-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIGOSPEEDRUN_DATA_DIR: data
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install data validator
        run: |
          python3 -m venv .refresh-venv
          .refresh-venv/bin/python -m pip install jsonschema==4.25.1
          echo "$GITHUB_WORKSPACE/.refresh-venv/bin" >> "$GITHUB_PATH"
      - name: Refresh data through GitHub GET requests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .refresh-venv/bin/python data/refresh.py
      - name: Validate refreshed bundle
        run: .refresh-venv/bin/python data/validate.py
      - name: Test data tooling
        run: .refresh-venv/bin/python -m unittest discover -s data -p 'test_*.py'
      - name: Install site dependencies
        run: npm ci --ignore-scripts
      - name: Validate and copy data
        run: npm run sync-data
      - name: Refresh public author profiles
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-authors.mjs
      - name: Check, test, and build
        run: |
          npm run check
          npm test
          npm run build
      - name: Commit changed data only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/*.json data/sources data/manifests src/data public/sources src/lib/author-profiles.json
          if git diff --cached --quiet; then
            echo 'Reviewed data is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh reviewed leaderboard data'
          gh auth setup-git
          git push origin "HEAD:$TARGET_BRANCH"
