name: Refresh reviewed data
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: refresh-reviewed-data
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BIGOSPEEDRUN_DATA_DIR: data
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install data validator
        run: |
          python3 -m venv .refresh-venv
          .refresh-venv/bin/python -m pip install jsonschema==4.25.1 anthropic==1.15.0
          echo "$GITHUB_WORKSPACE/.refresh-venv/bin" >> "$GITHUB_PATH"
      # ANTHROPIC_API_KEY: the Claude agreement check for CrocSwap claims (data/claim_judge.py).
      # This workflow runs on schedule and dispatch only, never on fork pull requests.
      - name: Refresh data through GitHub GET requests
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: .refresh-venv/bin/python data/refresh.py
      - name: Refresh direct submission issues and PRs
        continue-on-error: true
        timeout-minutes: 8
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .refresh-venv/bin/python data/direct_refresh.py
      # Anonymous GETs to prove2.me campaign pages and the formalpedia export. A held
      # board keeps its last import; the last step then fails the run (dead-man alert).
      - name: Import reviewed prove2.me results
        id: prove2me
        continue-on-error: true
        timeout-minutes: 5
        run: .refresh-venv/bin/python data/prove2me_import.py
      # The platypii Lean note on the IM OpenAI row (data/platypii_lean.py, GET only). A
      # network failure keeps the last state; a held check fails the review step.
      - name: Check the platypii Lean note
        continue-on-error: true
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .refresh-venv/bin/python data/platypii_lean.py
      # A new result that jumps implausibly past the published best leaves its board
      # until the lead approves it in data/review-decisions.json (data/review_hold.py).
      - name: Hold implausible new results for lead review
        run: .refresh-venv/bin/python data/review_hold.py
      - name: Validate refreshed bundle
        run: .refresh-venv/bin/python data/validate.py
      - name: Test data tooling
        run: .refresh-venv/bin/python -m unittest discover -s data -p 'test_*.py'
      - name: Install site dependencies
        run: npm ci --ignore-scripts
      - name: Validate and copy data
        run: npm run sync-data
      - name: Refresh public author profiles
        continue-on-error: true
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/refresh-authors.mjs
      - name: Check, test, and build
        run: |
          npm run check
          npm test
          npm run build
      - name: Plan Discord record notifications
        continue-on-error: true
        env:
          DISCORD_RECORDS_WEBHOOK: ${{ secrets.DISCORD_RECORDS_WEBHOOK }}
          DISCORD_RECORDS_OTHER_WEBHOOK: ${{ secrets.DISCORD_RECORDS_OTHER_WEBHOOK }}
        run: node --experimental-strip-types scripts/discord-records.ts plan "$RUNNER_TEMP/discord-records.json"
      - name: Commit changed data only
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- data/*.json data/sources data/manifests src/data public/sources src/lib/author-profiles.json src/lib/author-avatars.json src/lib/prove2me-campaigns.ts public/avatars
          if git diff --cached --quiet; then
            echo 'Reviewed data is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh reviewed leaderboard data'
          gh auth setup-git
          scripts/push-bot-commit.sh "$TARGET_BRANCH"
      - name: Post Discord record notifications
        id: records-send
        continue-on-error: true
        timeout-minutes: 3
        env:
          DISCORD_RECORDS_WEBHOOK: ${{ secrets.DISCORD_RECORDS_WEBHOOK }}
          DISCORD_RECORDS_OTHER_WEBHOOK: ${{ secrets.DISCORD_RECORDS_OTHER_WEBHOOK }}
        run: node --experimental-strip-types scripts/discord-records.ts send "$RUNNER_TEMP/discord-records.json"
      - name: Commit accepted record posts
        if: ${{ always() && steps.records-send.outcome != 'skipped' && steps.records-send.outcome != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f data/records-posts.json ]; then exit 0; fi
          git add -- data/records-posts.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Log accepted Discord record posts'
          gh auth setup-git
          scripts/push-bot-commit.sh "$TARGET_BRANCH"
      - name: Plan X record notifications
        id: x-plan
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node --experimental-strip-types scripts/x-records.ts plan "$RUNNER_TEMP/x-records.json"
      - name: Commit X reservations before sending
        id: x-reserve
        if: ${{ steps.x-plan.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f "$RUNNER_TEMP/x-records.json" ]; then exit 0; fi
          git add -- data/x-posts.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'Reserve X record posts before API delivery'
          fi
          gh auth setup-git
          scripts/push-bot-commit.sh "$TARGET_BRANCH"
      - name: Post X record notifications
        id: x-send
        if: ${{ steps.x-reserve.outcome == 'success' && steps.x-plan.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node --experimental-strip-types scripts/x-records.ts send "$RUNNER_TEMP/x-records.json"
      - name: Commit X delivery results
        if: ${{ always() && steps.x-send.outcome != 'skipped' && steps.x-send.outcome != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f data/x-posts.json ]; then exit 0; fi
          git add -- data/x-posts.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Log X record API delivery results'
          gh auth setup-git
          scripts/push-bot-commit.sh "$TARGET_BRANCH"
      - name: Fail the run when the prove2.me import is held
        if: ${{ always() && steps.prove2me.outcome == 'failure' }}
        run: |
          echo "::error::prove2.me import held or failed. Read the 'Import reviewed prove2.me results' step and data/prove2me.json, then review data/prove2me-trust.json."
          exit 1
      - name: Fail the run while a result waits for lead review
        if: ${{ !cancelled() }}
        run: .refresh-venv/bin/python data/review_hold.py --check
