# bigospeedrun.com on the VPS (phase C draft; not installed). Vercel does not use this file.
# auto-deploy.sh runs it as:
#   docker compose -p bigospeedrun -f /opt/bigospeedrun/compose.yaml --env-file /opt/bigospeedrun/release.env up -d --wait
# release.env holds BOS_SITE_IMAGE=ghcr.io/bigospeedrun/site@sha256:<digest> (auto-deploy.sh
# rewrites it) and BOS_UID / BOS_GID, the dedicated system user both containers run as (set
# once by hand; auto-deploy.sh keeps them). Compose refuses to start without them.
#
# Networks: the site container is only on `egress`, an internal network (no route out),
# shared with the allowlist proxy. Caddy on the host reaches the site through the Unix
# socket in /run/bigospeedrun (bigospeedrun.tmpfiles.conf: 0755, the socket is 0666), so
# no port is published.
# Only the proxy is also on `outbound`, and it opens tunnels only to EGRESS_ALLOW.
name: bigospeedrun

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  user: "${BOS_UID:?set in release.env}:${BOS_GID:?set in release.env}"
  restart: unless-stopped
  logging:
    driver: local
    options:
      max-size: 20m
      max-file: "5"

services:
  site:
    <<: *hardening
    image: ${BOS_SITE_IMAGE:?set in release.env}
    # ANTHROPIC_API_KEY, DISCORD_WEBHOOK_URL, DISCORD_CHAT_LOG_WEBHOOK_URL (root-only, 0600).
    env_file: /etc/bigospeedrun/site.env
    environment:
      SITE_SOCKET: /run/bigospeedrun/site.sock
      NODE_USE_ENV_PROXY: "1"
      HTTPS_PROXY: http://egress:3128
      HTTP_PROXY: http://egress:3128
      NO_PROXY: 127.0.0.1,localhost
    volumes:
      - type: bind
        source: /run/bigospeedrun
        target: /run/bigospeedrun
    networks: [egress]
    depends_on:
      egress:
        condition: service_healthy
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    # The image's HEALTHCHECK fetches /robots.txt on 127.0.0.1:3000 inside the container.

  egress:
    <<: *hardening
    # The same image and digest as the site: one artifact to pin and roll back.
    image: ${BOS_SITE_IMAGE:?set in release.env}
    command: ["node", "ops/self-host/egress-proxy.mjs"]
    environment:
      EGRESS_ALLOW: api.anthropic.com:443,discord.com:443
      EGRESS_PORT: "3128"
    networks: [egress, outbound]
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 64
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:net').connect(3128, '127.0.0.1').on('connect', () => process.exit(0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  egress:
    internal: true
  outbound: {}
