# /etc/tmpfiles.d/bigospeedrun.conf (not installed). The directory for the site's Unix
# socket, which Caddy connects to. The directory is 0755 and the site creates the socket
# with mode 0666, so any local user can connect: the socket serves only what the public site
# serves (lead decision, 2026-10-16; no change to the shared wg-caddy unit, whose DynamicUser
# group may not exist when tmpfiles runs at boot).
# bos-site is a dedicated system user, created once:
#   useradd --system --no-create-home --shell /usr/sbin/nologin bos-site
# Its numeric uid and gid go in /opt/bigospeedrun/release.env as BOS_UID and BOS_GID.
d /run/bigospeedrun 0755 bos-site bos-site -
