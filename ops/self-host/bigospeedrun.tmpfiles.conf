# /etc/tmpfiles.d/bigospeedrun.conf (not installed). The socket directory shared by the
# site container and Caddy. Only the site's user and Caddy's group may enter it.
# bos-site is a dedicated system user, created once:
#   useradd --system --no-create-home --shell /usr/sbin/nologin bos-site
# Its numeric uid and gid go in /opt/bigospeedrun/release.env as BOS_UID and BOS_GID.
# Replace `caddy` with the group the wg-caddy unit runs as (unchecked).
d /run/bigospeedrun 0750 bos-site caddy -
